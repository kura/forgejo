name: Build and Publish Docker Image
on:
  push:
    branches:
      - "main"
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: amd64
          - arch: arm64
            runner: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: data.forgejo.org/oci/node:24-alpine
    outputs:
      version: ${{ steps.v.outputs.version }}
      versions_amd64: ${{ steps.v.outputs.versions_amd64 }}
      versions_arm64: ${{ steps.v.outputs.versions_arm64 }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6
      - name: Install dependencies
        run: apk add docker-cli curl jq bash make
      - name: Update versions
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
             cd data/nginx
             make update ./Containerfile
      - name: Record versions
        id: v
        run: |
          version=$(grep 'ENV NGINX_VERSION' data/nginx/Containerfile | awk -F'=' '{print $2}')
          versions=$(grep -E '^ENV [A-Z0-9_]+_VERSION=' data/nginx/Containerfile | sha256sum | cut -d' ' -f1)
          [ -n "$version" ] || { echo "NGINX_VERSION not found"; exit 1; }
          echo "VERSION_ENV=$version" >> "$FORGEJO_ENV"
          echo "version=$version" >> "$FORGEJO_OUTPUT"
          echo "versions_${{ matrix.arch }}=$versions" >> "$FORGEJO_OUTPUT"
      - name: Setup Buildx
        uses: https://github.com/docker/setup-buildx-action@v4
      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: git.kura.gg
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}
      - name: Build and push image
        uses: https://github.com/docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          file: data/nginx/Containerfile
          context: .
          tags: |
            git.kura.gg/kura/forgejo/nginx:${{ env.VERSION_ENV }}-${{ matrix.arch }}
            ghcr.io/kura/forgejo/nginx:${{ env.VERSION_ENV }}-${{ matrix.arch }}
          push: true

  manifest:
    needs: build
    runs-on: amd64
    container:
      image: data.forgejo.org/oci/node:24-alpine
    env:
      V: ${{ needs.build.outputs.version }}
      H_AMD64: ${{ needs.build.outputs.versions_amd64 }}
      H_ARM64: ${{ needs.build.outputs.versions_arm64 }}
    steps:
      - name: Check both legs built the same versions
        run: |
          echo "version: $V"
          echo "amd64: $H_AMD64"
          echo "arm64: $H_ARM64"
          if [ -z "$V" ] || [ -z "$H_AMD64" ] || [ "$H_AMD64" != "$H_ARM64" ]; then
            echo "::error::matrix legs resolved different versions; not publishing :latest"
            exit 1
          fi
      - name: Install dependencies
        run: apk add docker-cli
      - name: Setup Buildx
        uses: https://github.com/docker/setup-buildx-action@v4
      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: git.kura.gg
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PASSWORD }}
      - name: Create multi-arch manifests
        run: |
          for repo in git.kura.gg/kura/forgejo/nginx ghcr.io/kura/forgejo/nginx; do
            docker buildx imagetools create \
              -t "$repo:$V" -t "$repo:latest" \
              "$repo:$V-amd64" "$repo:$V-arm64"
          done
