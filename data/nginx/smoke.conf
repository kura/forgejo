events {}

http {
    lua_package_path "/usr/lib/lua/?.lua;;";
    lua_shared_dict smoke 1m;

    init_by_lua_block {
        require "resty.core"
        require "resty.lrucache"
    }

    vhost_traffic_status_zone;

    server {
        listen 127.0.0.1:18080;
        brotli on;
        zstd on;

        location /vts { vhost_traffic_status_display; }

        location /smoke {
            content_by_lua_block {
                local m = assert(ngx.re.match("nginx/1.2.3", [[(\d+)\.(\d+)]], "jo"))
                assert(ngx.shared.smoke:set("k", 1))
                ngx.say("ok ", m[1], " ", ngx.md5("x"), " ", ngx.config.ngx_lua_version)
            }
        }
    }
}

